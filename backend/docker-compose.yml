
services:

  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE_PATH: eureka-server/eureka-server
    container_name: eureka-mobilidade
    ports:
      - "8761:8761"
    restart: unless-stopped

  account-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE_PATH: account-service
    container_name: account-mobilidade
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE_PATH: api-gateway/api-gateway
    container_name: gateway-mobilidade
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      RIDE_SERVICE_URL: lb://ride-service
    depends_on:
      - eureka-server
    restart: unless-stopped

  ride-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE_PATH: ride-service/ride-service
    container_name: ride-mobilidade
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5434/mobility_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      SPRING_RABBITMQ_HOST: host.docker.internal
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}

      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: 6379

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - eureka-server
    restart: unless-stopped

  ride-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ride-frontend
    ports:
      - "4200:4000"
    depends_on:
      - api-gateway
      - ride-service
    restart: unless-stopped
