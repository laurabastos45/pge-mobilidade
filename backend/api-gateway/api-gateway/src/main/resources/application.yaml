server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          websocket:
            allowed-origins:
              - https://pge-mobilidade.vercel.app
          routes:
            - id: ride-websocket
              uri: lb:ws://ride-service
              predicates:
                - Path=/ws/**
                - Header=Upgrade, websocket

            - id: ride-sockjs
              uri: lb://ride-service
              predicates:
                - Path=/ws/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
